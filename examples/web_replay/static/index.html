<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thalamus — Omi streaming replay</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="top">
    <div>
      <h1>Thalamus</h1>
      <p class="sub">Omi streaming replay · Path A · real DB layers</p>
    </div>
    <div class="controls" id="controls">
      <label class="ctl">Speed
        <input id="speed" type="number" min="0.1" step="0.1" value="1" title="1.0 = real log_timestamp deltas" />
      </label>
      <label class="ctl">Refine
        <select id="refine-mode" title="Stub is local; Venice hits api.venice.ai">
          <option value="stub" selected>Stub (local)</option>
          <option value="venice">Venice (LLM)</option>
        </select>
      </label>
      <button id="btn-play" type="button">Play</button>
      <button id="btn-reset" type="button">Reset</button>
      <button id="btn-stop" type="button">Stop</button>
      <button id="btn-menu" type="button" class="btn-menu" aria-haspopup="dialog" aria-controls="settings-dialog" title="Settings">Menu</button>
      <span id="badge" class="badge">idle</span>
      <span id="key-badge" class="badge muted" title="Venice API key in demo DB">key: …</span>
    </div>
  </header>

  <main class="grid">
    <section class="pane" id="pane-raw">
      <h2>Raw / Cochlea</h2>
      <div class="pane-body" id="raw"></div>
    </section>
    <section class="pane" id="pane-refined">
      <h2>Refined / Thalamus</h2>
      <div class="pane-body" id="refined"></div>
    </section>
    <section class="pane" id="pane-prov">
      <h2>Provenance</h2>
      <div class="pane-body" id="provenance"></div>
    </section>
    <section class="pane" id="pane-console">
      <h2>Console</h2>
      <div class="pane-body" id="console"></div>
    </section>
  </main>

  <dialog id="settings-dialog" class="settings-dialog">
    <form method="dialog" class="settings-panel">
      <header class="settings-head">
        <h2>Settings</h2>
        <button id="btn-close-settings" type="submit" class="btn-muted" value="cancel">Close</button>
      </header>
      <p class="settings-note">Secrets live in the demo SQLite DB (<code>app_secrets</code>) and survive Play/Reset.</p>
      <div class="settings-row">
        <label class="ctl grow">Venice API key
          <input id="venice-key" type="password" autocomplete="off" spellcheck="false"
                 placeholder="Paste key — shown as ••••" />
        </label>
      </div>
      <div class="settings-actions">
        <button id="btn-save-settings" type="button">Save key</button>
        <button id="btn-clear-key" type="button" class="btn-muted">Clear</button>
        <span id="key-hint" class="badge muted"></span>
      </div>
    </form>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
